name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Render backend with uncached workspace dependencies
        run: pnpm build:server
      - name: Start disposable MongoDB services
        run: docker compose up -d mongodb mongodb-standalone
      - name: Initialize replica set
        run: pnpm db:init
      - name: Prove migration idempotency
        env:
          MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: poker_ci_migrations
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - run: pnpm check
      - name: Rehearse encrypted backup and isolated authenticated restore
        timeout-minutes: 5
        run: pnpm test:backup
      - name: Build Cloudflare Worker
        run: pnpm --filter @poker/web build:worker
      - name: Install Chromium and system dependencies
        run: pnpm --filter @poker/web exec playwright install --with-deps chromium
      - name: Run full Chromium acceptance against disposable services
        timeout-minutes: 15
        run: pnpm --filter @poker/web exec playwright test --project=chromium
