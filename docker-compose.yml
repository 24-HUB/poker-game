services:
  db:
    image: postgres:16
    container_name: poker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: poker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poker_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: poker-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/poker_db
      PORT: 3000
      BETTER_AUTH_SECRET: your_very_secret_key
      # Allow requests from both 5173 and 5174 (Vite picks first available port)
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: poker-web
    restart: always
    ports:
      - "5173:5173"
    environment:
      # Browser connects to server on the HOST's localhost:3000
      VITE_API_URL: http://localhost:3000
    depends_on:
      - server

volumes:
  postgres_data:
